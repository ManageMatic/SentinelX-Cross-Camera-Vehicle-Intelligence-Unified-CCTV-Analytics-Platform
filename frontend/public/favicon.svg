<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="cyanLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Golden Outer Border Shield -->
  <path d="M 32 3 L 57 12 C 57 38 48 53 32 61 C 16 53 7 38 7 12 Z" fill="url(#shieldGold)" filter="url(#glow)"/>
  
  <!-- Inner Navy Shield Surface -->
  <path d="M 32 6 L 53 14 C 53 36 45 49 32 57 C 19 49 11 36 11 14 Z" fill="url(#shieldNavy)" stroke="#fbbf24" stroke-width="1"/>

  <!-- Tactical AI Aperture Outer Ring -->
  <circle cx="32" cy="35" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="32" cy="35" r="10" fill="url(#cyanLens)"/>
  <circle cx="32" cy="35" r="5" fill="#030712" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="32" cy="35" r="2" fill="#38bdf8"/>

  <!-- Optical Crosshair -->
  <line x1="32" y1="18" x2="32" y2="22" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="32" y1="48" x2="32" y2="52" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="15" y1="35" x2="19" y2="35" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="45" y1="35" x2="49" y2="35" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Top Crown / Crest -->
  <polygon points="32,9 35,14 39,11 38,16 26,16 25,11 29,14" fill="#fbbf24"/>
</svg>

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: netra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelx_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx_user -d sentinelx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: netra-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netra-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelx_user:sentinelx_password@postgres:5432/sentinelx_db
      VALKEY_URL: redis://valkey:6379/0
      SENTINEL_RTSP_HOST: ${SENTINEL_RTSP_HOST:-103.250.160.189}
      SENTINEL_RTSP_PORT: ${SENTINEL_RTSP_PORT:-8554}
      SENTINEL_USERNAME: ${SENTINEL_USERNAME:-}
      SENTINEL_ACCESS_CODE: ${SENTINEL_ACCESS_CODE:-}
      SENTINEL_RTSP_TRANSPORT: ${SENTINEL_RTSP_TRANSPORT:-tcp}
      SENTINEL_CONNECTION_TIMEOUT: ${SENTINEL_CONNECTION_TIMEOUT:-10000}
      SENTINEL_RECONNECT_MAX_DELAY: ${SENTINEL_RECONNECT_MAX_DELAY:-30}
      SENTINEL_CAMERA_PREFIX: ${SENTINEL_CAMERA_PREFIX:-cam}
      SENTINEL_CAMERA_START: ${SENTINEL_CAMERA_START:-1}
      SENTINEL_CAMERA_END: ${SENTINEL_CAMERA_END:-30}
      EVIDENCE_STORAGE_PATH: /app/data/evidence
    volumes:
      - ./data/evidence:/app/data/evidence
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netra-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
